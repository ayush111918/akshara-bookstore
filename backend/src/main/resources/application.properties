spring.application.name=akshara-api
server.port=8080

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/akshara}
spring.datasource.username=${DB_USERNAME:akshara_app}
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:akshara-api}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# External catalogue metadata (commerce data is never sent to these APIs)
app.book-import.contact=${BOOK_IMPORT_CONTACT:admin@akshara.local}
app.book-metadata.open-library.base-url=https://openlibrary.org
app.book-metadata.open-library.connect-timeout-ms=5000
app.book-metadata.open-library.read-timeout-ms=25000
app.book-metadata.open-library.cache-ttl-seconds=${OPEN_LIBRARY_CACHE_TTL_SECONDS:300}
app.book-metadata.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
app.book-metadata.google-books.base-url=https://www.googleapis.com/books/v1
app.book-metadata.google-books.connect-timeout-ms=5000
app.book-metadata.google-books.read-timeout-ms=15000

# Private reader uploads. Files stay outside the public catalogue and require authentication.
app.personal-library.storage-path=${PERSONAL_LIBRARY_STORAGE:./data/personal-library}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
