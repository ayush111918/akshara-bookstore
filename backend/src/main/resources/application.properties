spring.application.name=akshara-api
server.port=8080

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/akshara}
spring.datasource.username=${DB_USERNAME:akshara_app}
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false